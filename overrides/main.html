{% extends "base.html" %}
{% block extrahead %}
<meta name="narration-page" content="{{ page.file.src_uri if page else '' }}">
<link id="keri-dark-palette" href="{{ 'css/palettes/dark.css' | url }}" rel="stylesheet" media="(prefers-color-scheme: dark)">
<script src="{{ 'javascripts/palette.js' | url }}?v={{ config.extra.asset_versions['javascripts/palette.js'] }}"></script>
{% endblock %}
{% block side_panel %}
<aside id="terminal-mkdocs-side-panel">
  <details id="keri-navigation">
    <summary>Explore cardano-keri</summary>
    {% include "partials/side-nav/side-nav.html" %}
    {% include "partials/side-panel/side-toc.html" %}
  </details>
</aside>
{% endblock %}
{% block favicon %}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23283593'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='monospace'%3EK%3C/text%3E%3C/svg%3E">
{% endblock %}
