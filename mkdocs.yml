site_name: cardano-keri
site_description: Self-certifying identities on Cardano with pre-rotation
site_url: !ENV [MKDOCS_SITE_URL, "https://lambdasistemi.github.io/cardano-keri/"]
repo_url: https://github.com/lambdasistemi/cardano-keri
docs_dir: docs

hooks:
  - scripts/offered_reference_hook.py

plugins:
  - search
  - asciinema-player

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.magiclink
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Home: index.md
  - Offered API:
      - Caller stories: offered-api/index.md
      - Checkpoint lifecycle: offered-api/checkpoint.md
      - Historical evidence: offered-api/history.md
