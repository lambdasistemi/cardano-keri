name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preprod-witnesses:
    name: Preprod witnesses (kli)
    runs-on: nixos
    env:
      WITNESS_IMAGE: cardano-keri-witness:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - name: Build locked keripy image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016
          # The nested bash expands the job environment after Nix supplies Docker.
          nix shell nixpkgs#bash nixpkgs#docker-client --command \
            bash -euo pipefail -c '
              cleanup() {
                docker logout ghcr.io >/dev/null 2>&1 || true
              }
              trap cleanup EXIT
              printf "%s" "$GHCR_TOKEN" |
                docker login ghcr.io \
                  --username "$GITHUB_ACTOR" \
                  --password-stdin
              docker build \
                --tag "$WITNESS_IMAGE" \
                --file deploy/preprod/Dockerfile \
                .
            '
      - name: Validate deployment and run clean-client acceptance
        run: >-
          nix shell
          nixpkgs#coreutils
          nixpkgs#curl
          nixpkgs#docker-client
          nixpkgs#docker-compose
          nixpkgs#jq
          --command bash scripts/check-preprod-witnesses.sh
      - name: Remove CI image tag
        if: always()
        run: |
          nix shell nixpkgs#docker-client \
            --command docker image rm "$WITNESS_IMAGE" >/dev/null 2>&1 || true

  build-gate:
    name: Build Gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Warm offchain store (derivations + dev shell)
        working-directory: offchain
        run: >-
          nix build --quiet
          .#checks.x86_64-linux.unit-tests
          .#packages.x86_64-linux.format
          .#packages.x86_64-linux.format-check
          .#packages.x86_64-linux.hlint
          .#packages.x86_64-linux.ckeri
          .#checks.x86_64-linux.deployment-tests
          .#devShells.x86_64-linux.default.inputDerivation

  onchain:
    name: Onchain (Aiken)
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - name: Format check
        working-directory: onchain
        run: nix shell github:NixOS/nixpkgs/753cc8a3a87467296ddd1fa93f0cc3e81120ee46#aiken --command aiken fmt --check
      - name: Check (tests + type-check)
        working-directory: onchain
        run: nix shell github:NixOS/nixpkgs/753cc8a3a87467296ddd1fa93f0cc3e81120ee46#aiken --command aiken check

  lean:
    name: Lean (21 theorems + traceability gate)
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # The 21 proved theorems ARE the design (epic #24 / #124). `lake build`
      # elaborates every proof; a `sorry` only WARNS, so the grep turns the
      # warning into a failure ("breaks CI, not trust" — A-C04).
      - name: Build the lifecycle model and theorems (no sorry)
        working-directory: lean
        run: |
          set -o pipefail
          nix shell nixpkgs#lean4 --command lake build 2>&1 | tee build.log
          ! grep -q "uses 'sorry'" build.log
      # Map completeness + name existence + Haskell-regenerated verdict-vector
      # drift (the script ends in `just check-lifecycle-trace-vectors`, which
      # regenerates the Aiken vectors from the Haskell mirror in the dev shell
      # and diffs them against the committed module).
      - name: Traceability drift gate
        run: nix shell nixpkgs#just nixpkgs#ripgrep nixpkgs#gawk nixpkgs#gnused nixpkgs#gnugrep nixpkgs#coreutils --command bash scripts/check-lean-traceability.sh

  blake3-spike:
    name: BLAKE3 spike (Aiken 1.1.23)
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - name: Verify pinned compiler
        working-directory: spikes/88-blake3-plutus
        run: nix flake check --no-eval-cache
      - name: Format check
        working-directory: spikes/88-blake3-plutus
        run: nix develop --quiet -c aiken fmt --check
      - name: Check (tests + type-check)
        working-directory: spikes/88-blake3-plutus
        run: nix develop --quiet -c aiken check

  offchain:
    name: Offchain (Haskell)
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run unit tests
        working-directory: offchain
        run: nix run --quiet .#unit-tests
      - name: Run deployment and manifest tests
        working-directory: offchain
        run: nix run --quiet .#deployment-tests
      - name: Check ckeri opt-env-conf surface and precedence
        run: |
          nix build --quiet ./offchain#ckeri
          ./scripts/check-ckeri-cli.sh ./result/bin/ckeri
      - name: Check formatting
        working-directory: offchain
        run: nix run --quiet .#format-check
      - name: Lint
        working-directory: offchain
        run: nix run --quiet .#hlint

  devshell:
    name: Dev shell
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Prove `nix develop` yields a working toolchain AND that the full project
      # compiles from the dev shell CHaP-offline — without fetching the secure
      # https CHaP index a fresh CHaP-empty runner cannot reach (issue #99 S9c).
      # (hackage over http + the git SRPs stay live, as on the passing runner;
      # only the secure https CHaP index was the failure.) The dev shell injects a
      # Nix-LOCAL CHaP repository (from the CHaP flake input); `cabal update`
      # generates its index cache offline + refreshes hackage (plain http), then
      # the build compiles the CHaP stack + local project from local source.
      # --enable-tests covers the offchain/e2e test component + the
      # cardano-node-clients `devnet` sublibrary (a real full build, not reduced).
      - name: Dev-shell cabal build
        working-directory: offchain
        run: nix develop --quiet -c bash -c 'cabal update --project-file=cabal.project.devshell && cabal build all --enable-tests -O0 --project-file=cabal.project.devshell'

  e2e:
    name: E2E (withDevnet)
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Live-boundary smoke: starts real cardano-node devnets, preserves the #99
      # cage positive, and proves #116 Register/Advance/Close reach the applied
      # production checkpoint validator and are rejected at the staging boundary.
      - name: withDevnet cage + checkpoint staging smoke
        working-directory: offchain
        run: nix build --quiet -L .#checks.x86_64-linux.e2e

  m1-manifest:
    name: M1 preprod deploy transcript + manifest
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Match the raw deploy-to-verify transcript to the manifest
        run: >-
          nix shell
          nixpkgs#bash
          nixpkgs#coreutils
          nixpkgs#gnugrep
          nixpkgs#jq
          --command bash scripts/check-m1-acceptance-transcript.sh
      - name: Rebuild hashes and verify live preprod references
        env:
          KOIOS_TOKEN: ${{ secrets.KOIOS_TOKEN }}
        working-directory: offchain
        run: >-
          nix run --quiet .#ckeri --
          manifest verify
          --manifest ../deploy/preprod/m1-manifest.json
          --source-repo ..

  m1-register:
    name: M1 preprod registration transcript
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Match the raw KLI-to-register journey and verify settled txids
        env:
          KOIOS_TOKEN: ${{ secrets.KOIOS_TOKEN }}
        run: |
          nix build --quiet ./offchain#ckeri
          nix shell \
            nixpkgs#bash \
            nixpkgs#coreutils \
            nixpkgs#curl \
            nixpkgs#gnugrep \
            nixpkgs#gnused \
            nixpkgs#jq \
            --command env \
              CKERI_BIN=./result/bin/ckeri \
              KOIOS_TOKEN="$KOIOS_TOKEN" \
              bash scripts/check-register-acceptance-transcript.sh

  m1-advance:
    name: M1 preprod rotation + advance transcript
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Match the raw full journey, package, negatives, and settled txids
        env:
          KOIOS_TOKEN: ${{ secrets.KOIOS_TOKEN }}
        run: |
          nix build --quiet ./offchain#ckeri
          nix shell \
            nixpkgs#bash \
            nixpkgs#coreutils \
            nixpkgs#curl \
            nixpkgs#gawk \
            nixpkgs#gnugrep \
            nixpkgs#gnused \
            nixpkgs#jq \
            --command env \
              CKERI_BIN=./result/bin/ckeri \
              KOIOS_TOKEN="$KOIOS_TOKEN" \
              bash scripts/check-advance-acceptance-transcript.sh

  e2e-sweep:
    name: E2E batch sweep (withDevnet)
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Fast guard: the committed sweep-boundary.md must be internally
      # consistent (declared-aggregate arithmetic + cage script hash present),
      # so a hand-edit of the artifact is caught without a devnet.
      - name: Verify committed sweep artifact
        working-directory: offchain
        run: nix build --quiet -L .#checks.x86_64-linux.sweep-consistency
      # Heavy reproducible verification: regenerate the artifact by submitting
      # one Modify per batch size through withDevnet, ASSERTING each expected
      # node outcome (N=1..4 settle; N>=5 reject at the specific Phase-1 limit).
      # A boundary/harness regression fails the run. Not in the routine gate.
      - name: Regenerate + assert #99 Modify batch sweep
        working-directory: offchain
        run: nix run --quiet .#e2e-sweep
