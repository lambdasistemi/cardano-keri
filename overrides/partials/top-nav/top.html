<div class="container">
  <div class="terminal-nav">
    <header class="terminal-logo">
      <div id="mkdocs-terminal-site-name" class="logo terminal-prompt"><a href="{{ nav.homepage.url | url }}" class="no-style">{{ config.site_name }}</a></div>
    </header>
    <nav class="terminal-menu" aria-label="Site tools">
      <ul>
        {% include "partials/top-nav/search-button.html" %}
        <li id="keri-speed-item" hidden>
          <button id="keri-speed" class="top-icon" type="button" title="Narration speed" aria-label="Narration speed 1×">
            <svg viewBox="0 0 24 24" width="1.3em" height="1.3em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 18a9 9 0 1 1 15 0"/><path d="M12 14l4-5"/></svg>
            <span id="keri-speed-rate">1×</span>
          </button>
        </li>
        <li>
          <button id="keri-palette-toggle" class="top-icon" type="button" hidden title="Switch to dark mode" aria-label="Switch to dark mode">
            <svg class="icon-moon" viewBox="0 0 24 24" width="1.3em" height="1.3em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="1.3em" height="1.3em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</div>
